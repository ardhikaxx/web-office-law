<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="officeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b2e"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#06121f"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67e1a"/>
      <stop offset="50%" stop-color="#e0be6c"/>
      <stop offset="100%" stop-color="#a67e1a"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#143454"/>
      <stop offset="100%" stop-color="#0a1c2e"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f446c"/>
      <stop offset="100%" stop-color="#0f243a"/>
    </linearGradient>
  </defs>

  <!-- Background Wall -->
  <rect width="1000" height="700" fill="url(#officeBg)"/>

  <!-- Architectural Wall Moulding / Wainscoting -->
  <rect x="40" y="50" width="420" height="380" rx="8" fill="url(#panelGrad)" stroke="url(#goldGradient)" stroke-width="2"/>
  <rect x="65" y="75" width="370" height="330" rx="6" fill="#0b1e33" stroke="#1d436c" stroke-width="1.5"/>

  <!-- Bookshelf / Law Library with Legal Tomes -->
  <!-- Shelf 1 -->
  <rect x="90" y="110" width="320" height="12" fill="url(#goldGradient)"/>
  <rect x="100" y="122" width="22" height="75" fill="#8c2d2d" rx="2"/>
  <rect x="126" y="118" width="24" height="79" fill="#1b3e64" rx="2"/>
  <rect x="154" y="125" width="20" height="72" fill="#c59b27" rx="2"/>
  <rect x="178" y="120" width="26" height="77" fill="#2d5236" rx="2"/>
  <rect x="208" y="122" width="22" height="75" fill="#8c2d2d" rx="2"/>
  <rect x="234" y="116" width="28" height="81" fill="#1b3e64" rx="2"/>
  <rect x="266" y="124" width="18" height="73" fill="#c59b27" rx="2"/>
  <rect x="288" y="120" width="24" height="77" fill="#2d5236" rx="2"/>
  <rect x="316" y="122" width="22" height="75" fill="#1b3e64" rx="2"/>
  <rect x="342" y="118" width="24" height="79" fill="#8c2d2d" rx="2"/>
  <rect x="370" y="125" width="20" height="72" fill="#c59b27" rx="2"/>
  <rect x="90" y="197" width="320" height="8" fill="#16375a"/>

  <!-- Shelf 2 -->
  <rect x="100" y="222" width="24" height="85" fill="#1b3e64" rx="2"/>
  <rect x="128" y="220" width="26" height="87" fill="#8c2d2d" rx="2"/>
  <rect x="158" y="228" width="20" height="79" fill="#2d5236" rx="2"/>
  <rect x="182" y="224" width="22" height="83" fill="#c59b27" rx="2"/>
  <rect x="208" y="218" width="28" height="89" fill="#1b3e64" rx="2"/>
  <rect x="240" y="222" width="24" height="85" fill="#8c2d2d" rx="2"/>
  <rect x="268" y="226" width="20" height="81" fill="#c59b27" rx="2"/>
  <rect x="292" y="220" width="26" height="87" fill="#2d5236" rx="2"/>
  <rect x="322" y="224" width="22" height="83" fill="#1b3e64" rx="2"/>
  <rect x="348" y="222" width="24" height="85" fill="#8c2d2d" rx="2"/>
  <rect x="90" y="307" width="320" height="8" fill="#16375a"/>

  <!-- Certificate / Diplomas on the Right Wall -->
  <rect x="520" y="70" width="190" height="140" rx="4" fill="#f8f9fa" stroke="url(#goldGradient)" stroke-width="4"/>
  <rect x="535" y="85" width="160" height="110" fill="none" stroke="#c59b27" stroke-width="1"/>
  <line x1="560" y1="110" x2="670" y2="110" stroke="#0a1c2e" stroke-width="4"/>
  <line x1="575" y1="125" x2="655" y2="125" stroke="#718096" stroke-width="2"/>
  <line x1="565" y1="140" x2="665" y2="140" stroke="#718096" stroke-width="1.5"/>
  <circle cx="615" cy="165" r="12" fill="#c59b27"/>
  <polygon points="610,177 615,190 620,177" fill="#a67e1a"/>

  <!-- Large Glass Window with Skyline Silhouettes -->
  <rect x="740" y="50" width="220" height="380" rx="6" fill="#071524" stroke="#1d436c" stroke-width="2"/>
  <line x1="850" y1="50" x2="850" y2="430" stroke="#1d436c" stroke-width="3"/>
  <line x1="740" y1="240" x2="960" y2="240" stroke="#1d436c" stroke-width="3"/>
  <!-- Skyline -->
  <polygon points="760,430 760,280 790,280 790,430" fill="#0d2338"/>
  <polygon points="800,430 800,220 830,220 830,430" fill="#122f4b"/>
  <polygon points="840,430 840,250 880,250 880,430" fill="#0f2942"/>
  <polygon points="890,430 890,300 930,300 930,430" fill="#0b2034"/>
  <!-- Tiny City Lights -->
  <circle cx="815" cy="240" r="1.5" fill="#e0be6c"/>
  <circle cx="815" cy="260" r="1.5" fill="#e0be6c"/>
  <circle cx="855" cy="270" r="1.5" fill="#e0be6c"/>
  <circle cx="865" cy="290" r="1.5" fill="#e0be6c"/>

  <!-- Executive Mahogany / Slate Desk -->
  <polygon points="120,480 880,480 950,560 50,560" fill="url(#deskGrad)" stroke="url(#goldGradient)" stroke-width="2"/>
  <rect x="50" y="560" width="900" height="110" fill="#0a1928"/>
  <line x1="50" y1="620" x2="950" y2="620" stroke="#173554" stroke-width="2"/>

  <!-- Items on Desk: Executive Laptop, Scales of Justice, Legal Dossiers, Gavel -->
  <!-- Scales of Justice -->
  <g transform="translate(680, 390)">
    <!-- Base -->
    <ellipse cx="60" cy="90" rx="30" ry="7" fill="#c59b27"/>
    <!-- Pillar -->
    <rect x="58" y="15" width="4" height="75" fill="#e0be6c"/>
    <circle cx="60" cy="15" r="5" fill="#c59b27"/>
    <!-- Beam -->
    <line x1="15" y1="20" x2="105" y2="20" stroke="#c59b27" stroke-width="3"/>
    <!-- Pan Left -->
    <line x1="15" y1="20" x2="5" y2="45" stroke="#a67e1a" stroke-width="1.5"/>
    <line x1="15" y1="20" x2="25" y2="45" stroke="#a67e1a" stroke-width="1.5"/>
    <ellipse cx="15" cy="48" rx="14" ry="4" fill="#c59b27"/>
    <!-- Pan Right -->
    <line x1="105" y1="20" x2="95" y2="45" stroke="#a67e1a" stroke-width="1.5"/>
    <line x1="105" y1="20" x2="115" y2="45" stroke="#a67e1a" stroke-width="1.5"/>
    <ellipse cx="105" cy="48" rx="14" ry="4" fill="#c59b27"/>
  </g>

  <!-- Legal Briefcase & Files -->
  <rect x="180" y="495" width="140" height="50" rx="4" fill="#1b3956" stroke="#2a5885" stroke-width="1"/>
  <rect x="195" y="505" width="110" height="6" fill="#c59b27" rx="2"/>
  <rect x="195" y="518" width="80" height="4" fill="#64748b" rx="2"/>
  
  <!-- Wooden Gavel -->
  <g transform="translate(420, 485) rotate(-15)">
    <rect x="0" y="0" width="55" height="22" rx="4" fill="#8c4826" stroke="#c59b27" stroke-width="1.5"/>
    <rect x="23" y="18" width="8" height="65" rx="3" fill="#a85930"/>
    <ellipse cx="18" cy="80" rx="35" ry="10" fill="#633219" stroke="#c59b27" stroke-width="1"/>
  </g>

  <!-- Polished Floor Reflection Base -->
  <rect x="0" y="670" width="1000" height="30" fill="#040c15"/>
  <line x1="0" y1="670" x2="1000" y2="670" stroke="url(#goldGradient)" stroke-width="2"/>
</svg>
