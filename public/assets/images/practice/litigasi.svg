<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="gLitigasi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081524"/>
      <stop offset="50%" stop-color="#0e233b"/>
      <stop offset="100%" stop-color="#050e18"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67e1a"/>
      <stop offset="50%" stop-color="#e0be6c"/>
      <stop offset="100%" stop-color="#a67e1a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#gLitigasi)"/>
  <rect x="20" y="20" width="560" height="360" rx="8" fill="none" stroke="url(#goldG)" stroke-width="1.5" opacity="0.4"/>
  <!-- Courtroom Gavel & Pillars -->
  <g transform="translate(300, 200) scale(1.3)">
    <!-- Classical Courthouse Front -->
    <polygon points="-70,-30 0,-70 70,-30" fill="url(#goldG)"/>
    <rect x="-60" y="-20" width="12" height="70" fill="#f8fafc" rx="2"/>
    <rect x="-20" y="-20" width="12" height="70" fill="#f8fafc" rx="2"/>
    <rect x="10" y="-20" width="12" height="70" fill="#f8fafc" rx="2"/>
    <rect x="50" y="-20" width="12" height="70" fill="#f8fafc" rx="2"/>
    <rect x="-75" y="50" width="150" height="15" fill="url(#goldG)"/>
    <!-- Gavel overlay -->
    <g transform="translate(15, 20) rotate(-20)">
      <rect x="-25" y="-30" width="50" height="25" rx="4" fill="url(#goldG)"/>
      <rect x="-5" y="-5" width="10" height="70" rx="4" fill="url(#goldG)"/>
    </g>
  </g>
</svg>
