<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="gNonLit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081524"/>
      <stop offset="50%" stop-color="#0e233b"/>
      <stop offset="100%" stop-color="#050e18"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67e1a"/>
      <stop offset="50%" stop-color="#e0be6c"/>
      <stop offset="100%" stop-color="#a67e1a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#gNonLit)"/>
  <rect x="20" y="20" width="560" height="360" rx="8" fill="none" stroke="url(#goldG)" stroke-width="1.5" opacity="0.4"/>
  <!-- Legal Opinion, Contract Drafting & Advisory Motif -->
  <g transform="translate(300, 200) scale(1.3)">
    <!-- Document Stack -->
    <rect x="-65" y="-60" width="100" height="130" rx="6" fill="#1b3956" stroke="url(#goldG)" stroke-width="2"/>
    <rect x="-50" y="-75" width="100" height="130" rx="6" fill="#f8fafc" stroke="url(#goldG)" stroke-width="2"/>
    <!-- Document Text Lines -->
    <line x1="-35" y1="-50" x2="35" y2="-50" stroke="#0a1a2b" stroke-width="4" stroke-linecap="round"/>
    <line x1="-35" y1="-30" x2="35" y2="-30" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="-35" y1="-10" x2="35" y2="-10" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="-35" y1="10" x2="15" y2="10" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- Gold Wax Seal with Ribbon -->
    <circle cx="25" cy="35" r="16" fill="url(#goldG)"/>
    <polygon points="20,48 25,62 30,48" fill="#a67e1a"/>
  </g>
</svg>
