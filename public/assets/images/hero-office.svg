<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d18"/>
      <stop offset="40%" stop-color="#08182b"/>
      <stop offset="70%" stop-color="#0c223c"/>
      <stop offset="100%" stop-color="#061220"/>
    </linearGradient>
    <linearGradient id="columnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c233c"/>
      <stop offset="25%" stop-color="#193b61"/>
      <stop offset="50%" stop-color="#244d7c"/>
      <stop offset="75%" stop-color="#143254"/>
      <stop offset="100%" stop-color="#091b2e"/>
    </linearGradient>
    <linearGradient id="columnShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05101c"/>
      <stop offset="50%" stop-color="#0e243d"/>
      <stop offset="100%" stop-color="#061322"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#c59b27" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#c59b27" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c59b27" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ambientLight" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#274f7d" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#132b49" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#071524" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#040c17" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c3e66"/>
      <stop offset="50%" stop-color="#102742"/>
      <stop offset="100%" stop-color="#0a192c"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a17b18" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#dfbe66" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a17b18" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Deep Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#ambientLight)"/>

  <!-- Upper Classical Entablature / Cornice -->
  <rect x="0" y="0" width="1920" height="60" fill="#071524"/>
  <rect x="0" y="60" width="1920" height="20" fill="#0d233c"/>
  <line x1="0" y1="80" x2="1920" y2="80" stroke="url(#goldTrim)" stroke-width="3"/>
  <rect x="0" y="83" width="1920" height="70" fill="#091b2e"/>
  
  <!-- Architectural Dentils -->
  <g fill="#143254" opacity="0.6">
    <rect x="100" y="125" width="28" height="16"/>
    <rect x="150" y="125" width="28" height="16"/>
    <rect x="200" y="125" width="28" height="16"/>
    <rect x="250" y="125" width="28" height="16"/>
    <rect x="300" y="125" width="28" height="16"/>
    <rect x="350" y="125" width="28" height="16"/>
    <rect x="400" y="125" width="28" height="16"/>
    <rect x="450" y="125" width="28" height="16"/>
    <rect x="500" y="125" width="28" height="16"/>
    <rect x="550" y="125" width="28" height="16"/>
    <rect x="600" y="125" width="28" height="16"/>
    <rect x="650" y="125" width="28" height="16"/>
    <rect x="700" y="125" width="28" height="16"/>
    <rect x="750" y="125" width="28" height="16"/>
    <rect x="800" y="125" width="28" height="16"/>
    <rect x="850" y="125" width="28" height="16"/>
    <rect x="900" y="125" width="28" height="16"/>
    <rect x="950" y="125" width="28" height="16"/>
    <rect x="1000" y="125" width="28" height="16"/>
    <rect x="1050" y="125" width="28" height="16"/>
    <rect x="1100" y="125" width="28" height="16"/>
    <rect x="1150" y="125" width="28" height="16"/>
    <rect x="1200" y="125" width="28" height="16"/>
    <rect x="1250" y="125" width="28" height="16"/>
    <rect x="1300" y="125" width="28" height="16"/>
    <rect x="1350" y="125" width="28" height="16"/>
    <rect x="1400" y="125" width="28" height="16"/>
    <rect x="1450" y="125" width="28" height="16"/>
    <rect x="1500" y="125" width="18" height="16"/>
    <rect x="1550" y="125" width="28" height="16"/>
    <rect x="1600" y="125" width="28" height="16"/>
    <rect x="1650" y="125" width="28" height="16"/>
    <rect x="1700" y="125" width="28" height="16"/>
    <rect x="1750" y="125" width="28" height="16"/>
    <rect x="1800" y="125" width="28" height="16"/>
  </g>
  <line x1="0" y1="153" x2="1920" y2="153" stroke="url(#goldTrim)" stroke-width="2"/>
  <rect x="0" y="155" width="1920" height="25" fill="#0d233c"/>

  <!-- Classical Arches in the Background -->
  <g opacity="0.4">
    <!-- Arch 1 -->
    <path d="M 120 750 V 380 A 130 130 0 0 1 380 380 V 750" fill="none" stroke="#16375c" stroke-width="14"/>
    <path d="M 140 750 V 390 A 110 110 0 0 1 360 390 V 750" fill="#081729" opacity="0.7"/>
    <!-- Arch 2 -->
    <path d="M 440 750 V 380 A 130 130 0 0 1 700 380 V 750" fill="none" stroke="#1c4470" stroke-width="14"/>
    <path d="M 460 750 V 390 A 110 110 0 0 1 680 390 V 750" fill="#091b2e" opacity="0.7"/>
    <!-- Arch 3 -->
    <path d="M 760 750 V 380 A 130 130 0 0 1 1020 380 V 750" fill="none" stroke="#225389" stroke-width="14"/>
    <path d="M 780 750 V 390 A 110 110 0 0 1 1000 390 V 750" fill="#0b2036" opacity="0.7"/>
    <!-- Arch 4 -->
    <path d="M 1080 750 V 380 A 130 130 0 0 1 1340 380 V 750" fill="none" stroke="#245892" stroke-width="14"/>
    <path d="M 1100 750 V 390 A 110 110 0 0 1 1320 390 V 750" fill="#0d243e" opacity="0.7"/>
    <!-- Arch 5 -->
    <path d="M 1400 750 V 380 A 130 130 0 0 1 1660 380 V 750" fill="none" stroke="#1a416b" stroke-width="14"/>
    <path d="M 1420 750 V 390 A 110 110 0 0 1 1640 390 V 750" fill="#08182a" opacity="0.7"/>
  </g>

  <!-- Majestic Grand Courthouse Columns (Colonnade) -->
  <!-- Col 1 (Far Left) -->
  <g opacity="0.85">
    <rect x="70" y="180" width="130" height="40" rx="4" fill="#132c49"/>
    <rect x="85" y="220" width="100" height="730" fill="url(#columnShadow)"/>
    <!-- Fluting lines -->
    <line x1="102" y1="220" x2="102" y2="950" stroke="#1d426a" stroke-width="3"/>
    <line x1="118" y1="220" x2="118" y2="950" stroke="#1a3c61" stroke-width="3"/>
    <line x1="135" y1="220" x2="135" y2="950" stroke="#173557" stroke-width="3"/>
    <line x1="152" y1="220" x2="152" y2="950" stroke="#142f4e" stroke-width="3"/>
    <line x1="168" y1="220" x2="168" y2="950" stroke="#0e233b" stroke-width="3"/>
    <rect x="65" y="950" width="140" height="50" rx="4" fill="#0d2238"/>
  </g>

  <!-- Col 2 -->
  <g opacity="0.9">
    <rect x="390" y="180" width="130" height="40" rx="4" fill="#18385d"/>
    <rect x="405" y="220" width="100" height="730" fill="url(#columnGrad)"/>
    <!-- Fluting -->
    <line x1="422" y1="220" x2="422" y2="950" stroke="#255180" stroke-width="3"/>
    <line x1="438" y1="220" x2="438" y2="950" stroke="#2d5e94" stroke-width="3"/>
    <line x1="455" y1="220" x2="455" y2="950" stroke="#285688" stroke-width="3"/>
    <line x1="472" y1="220" x2="472" y2="950" stroke="#1d446f" stroke-width="3"/>
    <line x1="488" y1="220" x2="488" y2="950" stroke="#143254" stroke-width="3"/>
    <rect x="385" y="950" width="140" height="50" rx="4" fill="#122a45"/>
  </g>

  <!-- Col 3 -->
  <g opacity="0.92">
    <rect x="710" y="180" width="130" height="40" rx="4" fill="#1c426e"/>
    <rect x="725" y="220" width="100" height="730" fill="url(#columnGrad)"/>
    <line x1="742" y1="220" x2="742" y2="950" stroke="#2a5a8f" stroke-width="3"/>
    <line x1="758" y1="220" x2="758" y2="950" stroke="#336ba8" stroke-width="3"/>
    <line x1="775" y1="220" x2="775" y2="950" stroke="#2c6099" stroke-width="3"/>
    <line x1="792" y1="220" x2="792" y2="950" stroke="#214b79" stroke-width="3"/>
    <line x1="808" y1="220" x2="808" y2="950" stroke="#173659" stroke-width="3"/>
    <rect x="705" y="950" width="140" height="50" rx="4" fill="#14304f"/>
  </g>

  <!-- Col 4 -->
  <g opacity="0.95">
    <rect x="1030" y="180" width="140" height="42" rx="4" fill="#204b7d"/>
    <rect x="1047" y="222" width="106" height="728" fill="url(#columnGrad)"/>
    <line x1="1065" y1="222" x2="1065" y2="950" stroke="#2f649f" stroke-width="3"/>
    <line x1="1083" y1="222" x2="1083" y2="950" stroke="#3a77bd" stroke-width="3"/>
    <line x1="1100" y1="222" x2="1100" y2="950" stroke="#3168a5" stroke-width="3"/>
    <line x1="1118" y1="222" x2="1118" y2="950" stroke="#245183" stroke-width="3"/>
    <line x1="1135" y1="222" x2="1135" y2="950" stroke="#193c62" stroke-width="3"/>
    <rect x="1025" y="950" width="150" height="50" rx="4" fill="#163657"/>
  </g>

  <!-- Col 5 (Hero statue backdrop column) -->
  <g opacity="0.88">
    <rect x="1350" y="180" width="140" height="42" rx="4" fill="#1b406b"/>
    <rect x="1367" y="222" width="106" height="728" fill="url(#columnGrad)"/>
    <line x1="1385" y1="222" x2="1385" y2="950" stroke="#29598e" stroke-width="3"/>
    <line x1="1403" y1="222" x2="1403" y2="950" stroke="#346da9" stroke-width="3"/>
    <line x1="1420" y1="222" x2="1420" y2="950" stroke="#2a5d93" stroke-width="3"/>
    <line x1="1438" y1="222" x2="1438" y2="950" stroke="#1f4672" stroke-width="3"/>
    <line x1="1455" y1="222" x2="1455" y2="950" stroke="#153457" stroke-width="3"/>
    <rect x="1345" y="950" width="150" height="50" rx="4" fill="#132c49"/>
  </g>

  <!-- Col 6 (Far Right) -->
  <g opacity="0.75">
    <rect x="1680" y="180" width="130" height="40" rx="4" fill="#122a45"/>
    <rect x="1695" y="220" width="100" height="730" fill="url(#columnShadow)"/>
    <rect x="1675" y="950" width="140" height="50" rx="4" fill="#0d2138"/>
  </g>

  <!-- Marble Floor Base with Reflections & Gold Line -->
  <rect x="0" y="1000" width="1920" height="80" fill="#050e18"/>
  <line x1="0" y1="1000" x2="1920" y2="1000" stroke="url(#goldTrim)" stroke-width="2"/>

  <!-- Atmospheric Gold Lighting Accent Rays / Beams -->
  <polygon points="1200,0 1550,0 1780,1080 1350,1080" fill="url(#goldLight)"/>
  
  <!-- Outer Vignette Overlay -->
  <rect width="1920" height="1080" fill="#030810" opacity="0.45"/>
</svg>
