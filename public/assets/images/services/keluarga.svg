<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="gKeluarga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2b"/>
      <stop offset="100%" stop-color="#142c48"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67e1a"/>
      <stop offset="50%" stop-color="#e0be6c"/>
      <stop offset="100%" stop-color="#a67e1a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#gKeluarga)"/>
  <rect x="20" y="20" width="560" height="360" rx="8" fill="none" stroke="url(#goldG)" stroke-width="1.5" opacity="0.4"/>
  <!-- Family Shield Protection -->
  <g transform="translate(300, 200) scale(1.3)">
    <!-- Shield -->
    <path d="M 0,-70 C 60,-70 80,-40 80,10 C 80,60 0,90 0,90 C 0,90 -80,60 -80,10 C -80,-40 -60,-70 0,-70 Z" fill="none" stroke="url(#goldG)" stroke-width="3.5"/>
    <!-- Roof / Protection Motif -->
    <path d="M -50,-20 L 0,-60 L 50,-20" fill="none" stroke="url(#goldG)" stroke-width="4" stroke-linecap="round"/>
    <!-- Figures -->
    <!-- Adult 1 -->
    <circle cx="-25" cy="-5" r="10" fill="#f8fafc"/>
    <path d="M -40,30 C -40,12 -10,12 -10,30" fill="#f8fafc"/>
    <!-- Child -->
    <circle cx="0" cy="10" r="7" fill="url(#goldG)"/>
    <path d="M -12,35 C -12,23 12,23 12,35" fill="url(#goldG)"/>
    <!-- Adult 2 -->
    <circle cx="25" cy="-5" r="10" fill="#f8fafc"/>
    <path d="M 10,30 C 10,12 40,12 40,30" fill="#f8fafc"/>
  </g>
</svg>
