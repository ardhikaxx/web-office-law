<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="gPidana" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2b"/>
      <stop offset="100%" stop-color="#142c47"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67e1a"/>
      <stop offset="50%" stop-color="#e0be6c"/>
      <stop offset="100%" stop-color="#a67e1a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#gPidana)"/>
  <rect x="20" y="20" width="560" height="360" rx="8" fill="none" stroke="url(#goldG)" stroke-width="1.5" opacity="0.4"/>
  <!-- Gavel & Soundblock -->
  <g transform="translate(300, 200) scale(1.3)">
    <!-- Base / Soundblock -->
    <ellipse cx="0" cy="55" rx="75" ry="20" fill="url(#goldG)"/>
    <ellipse cx="0" cy="45" rx="65" ry="16" fill="#1b395a" stroke="url(#goldG)" stroke-width="2"/>
    <!-- Gavel Head & Handle (Angled) -->
    <g transform="rotate(-25, 0, 0)">
      <rect x="-45" y="-50" width="90" height="45" rx="6" fill="url(#goldG)"/>
      <line x1="-30" y1="-50" x2="-30" y2="-5" stroke="#0a1a2b" stroke-width="3"/>
      <line x1="30" y1="-50" x2="30" y2="-5" stroke="#0a1a2b" stroke-width="3"/>
      <rect x="-8" y="-5" width="16" height="120" rx="6" fill="url(#goldG)"/>
      <circle cx="0" cy="115" r="10" fill="url(#goldG)"/>
    </g>
  </g>
</svg>
