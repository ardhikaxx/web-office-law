<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1c2e"/>
      <stop offset="100%" stop-color="#122b46"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67e1a"/>
      <stop offset="50%" stop-color="#e0be6c"/>
      <stop offset="100%" stop-color="#a67e1a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#g1)"/>
  <rect x="20" y="20" width="560" height="360" rx="8" fill="none" stroke="url(#goldG)" stroke-width="1.5" opacity="0.4"/>
  <!-- Scales of Justice Emblem -->
  <g transform="translate(300, 190) scale(1.4)">
    <line x1="0" y1="-80" x2="0" y2="60" stroke="url(#goldG)" stroke-width="5"/>
    <ellipse cx="0" cy="65" rx="35" ry="10" fill="url(#goldG)"/>
    <circle cx="0" cy="-80" r="10" fill="url(#goldG)"/>
    <line x1="-70" y1="-65" x2="70" y2="-65" stroke="url(#goldG)" stroke-width="4"/>
    <!-- Left Pan -->
    <line x1="-70" y1="-65" x2="-90" y2="-15" stroke="#e0be6c" stroke-width="2"/>
    <line x1="-70" y1="-65" x2="-50" y2="-15" stroke="#e0be6c" stroke-width="2"/>
    <path d="M -100 -15 Q -70 15 -40 -15 Z" fill="url(#goldG)"/>
    <!-- Right Pan -->
    <line x1="70" y1="-65" x2="50" y2="-15" stroke="#e0be6c" stroke-width="2"/>
    <line x1="70" y1="-65" x2="90" y2="-15" stroke="#e0be6c" stroke-width="2"/>
    <path d="M 40 -15 Q 70 15 100 -15 Z" fill="url(#goldG)"/>
  </g>
</svg>
