<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="gSengketa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2b"/>
      <stop offset="100%" stop-color="#142c48"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67e1a"/>
      <stop offset="50%" stop-color="#e0be6c"/>
      <stop offset="100%" stop-color="#a67e1a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#gSengketa)"/>
  <rect x="20" y="20" width="560" height="360" rx="8" fill="none" stroke="url(#goldG)" stroke-width="1.5" opacity="0.4"/>
  <!-- Handshake & Mediation Emblem -->
  <g transform="translate(300, 200) scale(1.3)">
    <!-- Balance Circle -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#goldG)" stroke-width="2" stroke-dasharray="8 6"/>
    <!-- Handshake -->
    <path d="M -50,-10 L -25,-10 L -5,10 L 15,-10 L 30,-10 L 45,5 L 35,20 L 15,20 L -5,0 L -25,20 L -45,5 Z" fill="url(#goldG)"/>
    <!-- Scales balance above -->
    <path d="M -25,-35 L 25,-35 M 0,-45 L 0,-25" stroke="#f8fafc" stroke-width="2.5"/>
  </g>
</svg>
