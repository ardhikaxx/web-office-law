<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="gKorp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1828"/>
      <stop offset="100%" stop-color="#142a42"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67e1a"/>
      <stop offset="50%" stop-color="#e0be6c"/>
      <stop offset="100%" stop-color="#a67e1a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#gKorp)"/>
  <rect x="20" y="20" width="560" height="360" rx="8" fill="none" stroke="url(#goldG)" stroke-width="1.5" opacity="0.4"/>
  <!-- Corporate Headquarters Columns -->
  <g transform="translate(300, 200) scale(1.3)">
    <!-- Pediment -->
    <polygon points="-80,-40 0,-85 80,-40" fill="url(#goldG)"/>
    <rect x="-80" y="-40" width="160" height="12" fill="url(#goldG)"/>
    <!-- Columns -->
    <rect x="-70" y="-28" width="16" height="85" fill="#f8fafc" rx="2"/>
    <rect x="-35" y="-28" width="16" height="85" fill="#f8fafc" rx="2"/>
    <rect x="0" y="-28" width="16" height="85" fill="#f8fafc" rx="2"/>
    <rect x="35" y="-28" width="16" height="85" fill="#f8fafc" rx="2"/>
    <rect x="70" y="-28" width="16" height="85" fill="#f8fafc" rx="2"/>
    <!-- Base -->
    <rect x="-90" y="57" width="180" height="15" fill="url(#goldG)"/>
  </g>
</svg>
