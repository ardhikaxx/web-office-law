<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="gProp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2b"/>
      <stop offset="100%" stop-color="#142c48"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67e1a"/>
      <stop offset="50%" stop-color="#e0be6c"/>
      <stop offset="100%" stop-color="#a67e1a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#gProp)"/>
  <rect x="20" y="20" width="560" height="360" rx="8" fill="none" stroke="url(#goldG)" stroke-width="1.5" opacity="0.4"/>
  <!-- Property & Land Deed Emblem -->
  <g transform="translate(300, 200) scale(1.3)">
    <!-- House / Property Structure -->
    <polygon points="0,-75 65,-25 65,65 -65,65 -65,-25" fill="none" stroke="url(#goldG)" stroke-width="3.5"/>
    <polygon points="0,-60 50,-20 50,55 -50,55 -50,-20" fill="#0f2238"/>
    <!-- Chimney -->
    <rect x="30" y="-60" width="12" height="25" fill="url(#goldG)"/>
    <!-- Door -->
    <rect x="-15" y="10" width="30" height="45" rx="3" fill="url(#goldG)"/>
    <!-- Key / Deed Motif -->
    <circle cx="0" cy="-20" r="10" fill="#f8fafc"/>
  </g>
</svg>
