<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="gKontrak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b2d"/>
      <stop offset="100%" stop-color="#152f4c"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67e1a"/>
      <stop offset="50%" stop-color="#e0be6c"/>
      <stop offset="100%" stop-color="#a67e1a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#gKontrak)"/>
  <rect x="20" y="20" width="560" height="360" rx="8" fill="none" stroke="url(#goldG)" stroke-width="1.5" opacity="0.4"/>
  <!-- Contract Parchment & Seal -->
  <g transform="translate(300, 200) scale(1.3)">
    <rect x="-60" y="-80" width="120" height="160" rx="8" fill="#f8fafc" stroke="url(#goldG)" stroke-width="3"/>
    <!-- Lines -->
    <line x1="-40" y1="-50" x2="40" y2="-50" stroke="#0b1b2d" stroke-width="4" stroke-linecap="round"/>
    <line x1="-40" y1="-30" x2="40" y2="-30" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="-40" y1="-10" x2="40" y2="-10" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="-40" y1="10" x2="20" y2="10" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- Wax Seal -->
    <circle cx="25" cy="50" r="18" fill="url(#goldG)"/>
    <polygon points="20,65 25,80 30,65" fill="#a67e1a"/>
    <!-- Quill / Fountain pen -->
    <path d="M -40,55 Q -20,40 10,48" stroke="#0b1b2d" stroke-width="2" fill="none"/>
  </g>
</svg>
