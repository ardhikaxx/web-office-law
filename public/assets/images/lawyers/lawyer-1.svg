<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d30"/>
      <stop offset="50%" stop-color="#122a45"/>
      <stop offset="100%" stop-color="#081422"/>
    </linearGradient>
    <radialGradient id="portraitGlow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#2a507a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a1d30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldPin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0be6c"/>
      <stop offset="100%" stop-color="#a67e1a"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162c44"/>
      <stop offset="100%" stop-color="#0b1724"/>
    </linearGradient>
  </defs>

  <rect width="600" height="700" fill="url(#bgGrad)"/>
  <rect width="600" height="700" fill="url(#portraitGlow)"/>

  <!-- Subtle Architectural Pillars in Background -->
  <line x1="120" y1="0" x2="120" y2="700" stroke="#143152" stroke-width="2" opacity="0.3"/>
  <line x1="480" y1="0" x2="480" y2="700" stroke="#143152" stroke-width="2" opacity="0.3"/>

  <!-- Executive Silhouette Portrait - Male Senior (Holong Siregar) -->
  <g transform="translate(0, 30)">
    <!-- Head & Hair -->
    <path d="M 230,220 C 230,120 370,120 370,220 C 370,300 230,300 230,220 Z" fill="#2d3748"/>
    <!-- Face Silhouette -->
    <path d="M 245,210 C 245,145 355,145 355,210 C 355,285 300,320 300,320 C 300,320 245,285 245,210 Z" fill="#d4a373"/>
    <!-- Hair Styling -->
    <path d="M 235,190 C 235,130 280,110 330,115 C 365,120 372,150 365,185 C 350,150 330,140 295,142 C 265,145 245,160 235,190 Z" fill="#1a202c"/>
    <!-- Glasses (Senior Partner Executive touch) -->
    <g stroke="url(#goldPin)" stroke-width="3" fill="none" opacity="0.9">
      <rect x="255" y="195" width="38" height="26" rx="4"/>
      <rect x="307" y="195" width="38" height="26" rx="4"/>
      <line x1="293" y1="205" x2="307" y2="205"/>
      <line x1="245" y1="202" x2="255" y2="202"/>
      <line x1="345" y1="202" x2="355" y2="202"/>
    </g>

    <!-- Neck -->
    <rect x="280" y="300" width="40" height="60" fill="#c59261"/>

    <!-- White Shirt Collar -->
    <polygon points="260,345 300,410 340,345 320,335 300,355 280,335" fill="#f8fafc"/>
    
    <!-- Red/Burgundy or Navy Gold Tie -->
    <polygon points="292,360 308,360 312,490 300,520 288,490" fill="#881337"/>
    <polygon points="290,360 310,360 306,380 294,380" fill="#9f1239"/>
    <!-- Tie Stripes -->
    <line x1="293" y1="400" x2="307" y2="405" stroke="url(#goldPin)" stroke-width="2"/>
    <line x1="291" y1="430" x2="309" y2="435" stroke="url(#goldPin)" stroke-width="2"/>
    <line x1="289" y1="460" x2="311" y2="465" stroke="url(#goldPin)" stroke-width="2"/>

    <!-- Tailored Suit Jacket & Shoulders -->
    <path d="M 120,670 C 130,470 200,380 260,350 L 300,430 L 340,350 C 400,380 470,470 480,670 Z" fill="url(#suitGrad)"/>
    <!-- Lapels -->
    <polygon points="260,350 220,440 280,510 295,430" fill="#1b3652"/>
    <polygon points="340,350 380,440 320,510 305,430" fill="#18314a"/>

    <!-- Gold Lapel Pin (Scales of Justice emblem) -->
    <circle cx="238" cy="420" r="7" fill="url(#goldPin)"/>
    <path d="M 235,420 L 241,420 M 238,416 L 238,424" stroke="#0a1d30" stroke-width="1.5"/>

    <!-- Pocket Square -->
    <polygon points="360,455 375,445 385,455" fill="#f8fafc"/>
  </g>

  <!-- Elegant Inner Border -->
  <rect x="15" y="15" width="570" height="670" rx="8" fill="none" stroke="url(#goldPin)" stroke-width="1.5" opacity="0.35"/>
</svg>
