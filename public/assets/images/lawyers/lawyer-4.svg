<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2b"/>
      <stop offset="50%" stop-color="#142c47"/>
      <stop offset="100%" stop-color="#06121f"/>
    </linearGradient>
    <radialGradient id="portraitGlow4" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#2a537f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a1a2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldPin4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0be6c"/>
      <stop offset="100%" stop-color="#a67e1a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="700" fill="url(#bgGrad4)"/>
  <rect width="600" height="700" fill="url(#portraitGlow4)"/>

  <!-- Female Associate Silhouette (Lawyer 4) -->
  <g transform="translate(0, 30)">
    <!-- Longer Professional Hair Background -->
    <path d="M 215,220 C 215,100 385,100 385,220 C 395,330 380,440 370,470 C 355,440 350,340 340,300 C 330,300 270,300 260,300 C 250,340 245,440 230,470 C 220,440 205,330 215,220 Z" fill="#1e293b"/>
    <!-- Face -->
    <path d="M 252,210 C 252,150 348,150 348,210 C 348,280 300,312 300,312 C 300,312 252,280 252,210 Z" fill="#deb887"/>
    <!-- Front Hair Silhouette -->
    <path d="M 225,180 C 235,115 285,105 325,108 C 370,112 375,150 370,185 C 350,140 325,130 295,132 C 265,134 245,155 225,180 Z" fill="#0f172a"/>
    <!-- Neck -->
    <rect x="284" y="300" width="32" height="50" fill="#cd9d68"/>
    <!-- Blouse & V-Neck Inner Collar -->
    <polygon points="268,350 300,420 332,350 316,340 300,360 284,340" fill="#f8fafc"/>
    <circle cx="300" cy="385" r="5" fill="url(#goldPin4)"/>
    <!-- Tailored Women's Executive Blazer -->
    <path d="M 135,670 C 145,480 215,390 270,355 L 300,440 L 330,355 C 385,390 455,480 465,670 Z" fill="#0f2136"/>
    <polygon points="270,355 230,440 285,510 298,440" fill="#18324e"/>
    <polygon points="330,355 370,440 315,510 302,440" fill="#152b44"/>
    <!-- Gold Lapel Brooch / Pin -->
    <circle cx="245" cy="420" r="6" fill="url(#goldPin4)"/>
  </g>

  <rect x="15" y="15" width="570" height="670" rx="8" fill="none" stroke="url(#goldPin4)" stroke-width="1.5" opacity="0.35"/>
</svg>
