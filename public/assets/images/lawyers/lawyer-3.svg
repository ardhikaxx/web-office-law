<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2c"/>
      <stop offset="50%" stop-color="#112944"/>
      <stop offset="100%" stop-color="#06111e"/>
    </linearGradient>
    <radialGradient id="portraitGlow3" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#264e77" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a1a2c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldPin3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0be6c"/>
      <stop offset="100%" stop-color="#a67e1a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="700" fill="url(#bgGrad3)"/>
  <rect width="600" height="700" fill="url(#portraitGlow3)"/>

  <!-- Senior Corporate Associate Silhouette -->
  <g transform="translate(0, 30)">
    <path d="M 235,220 C 235,125 365,125 365,220 C 365,295 235,295 235,220 Z" fill="#334155"/>
    <path d="M 248,210 C 248,150 352,150 352,210 C 352,285 300,318 300,318 C 300,318 248,285 248,210 Z" fill="#e2b993"/>
    <!-- Modern Side Part Hair -->
    <path d="M 238,190 C 238,130 280,110 330,112 C 365,116 370,145 365,185 C 345,150 320,135 285,138 C 255,140 240,165 238,190 Z" fill="#1e293b"/>
    <!-- Neck -->
    <rect x="282" y="300" width="36" height="55" fill="#cf9f72"/>
    <!-- Shirt -->
    <polygon points="265,345 300,405 335,345 315,335 300,355 285,335" fill="#f8fafc"/>
    <!-- Gold / Amber Silk Tie -->
    <polygon points="293,360 307,360 311,485 300,515 289,485" fill="#b45309"/>
    <polygon points="291,360 309,360 305,380 295,380" fill="#d97706"/>
    <!-- Charcoal Corporate Suit -->
    <path d="M 125,670 C 135,475 205,385 265,350 L 300,425 L 335,350 C 395,385 465,475 475,670 Z" fill="#1e293b"/>
    <polygon points="265,350 225,440 285,510 295,430" fill="#2d3748"/>
    <polygon points="335,350 375,440 315,510 305,430" fill="#283141"/>
    <!-- Gold Lapel Pin -->
    <circle cx="242" cy="420" r="6" fill="url(#goldPin3)"/>
    <!-- Pocket Square -->
    <polygon points="360,455 375,445 385,455" fill="#f8fafc"/>
  </g>

  <rect x="15" y="15" width="570" height="670" rx="8" fill="none" stroke="url(#goldPin3)" stroke-width="1.5" opacity="0.35"/>
</svg>
