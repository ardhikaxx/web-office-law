<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081626"/>
      <stop offset="50%" stop-color="#0f253d"/>
      <stop offset="100%" stop-color="#050e18"/>
    </linearGradient>
    <radialGradient id="portraitGlow2" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#244569" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#081626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldPin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0be6c"/>
      <stop offset="100%" stop-color="#a67e1a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="700" fill="url(#bgGrad2)"/>
  <rect width="600" height="700" fill="url(#portraitGlow2)"/>

  <!-- Criminal Law Partner Silhouette -->
  <g transform="translate(0, 30)">
    <!-- Head -->
    <path d="M 235,215 C 235,120 365,120 365,215 C 365,295 235,295 235,215 Z" fill="#1e293b"/>
    <path d="M 250,210 C 250,150 350,150 350,210 C 350,285 300,315 300,315 C 300,315 250,285 250,210 Z" fill="#deb887"/>
    <!-- Short Trimmed Hair -->
    <path d="M 240,185 C 240,125 285,115 320,118 C 360,122 365,155 360,185 C 345,155 325,145 295,145 C 270,145 250,160 240,185 Z" fill="#0f172a"/>
    <!-- Neck -->
    <rect x="282" y="300" width="36" height="55" fill="#cd9d68"/>
    <!-- Shirt -->
    <polygon points="265,345 300,405 335,345 315,335 300,355 285,335" fill="#ffffff"/>
    <!-- Midnight Blue Tie -->
    <polygon points="293,360 307,360 311,485 300,515 289,485" fill="#0c4a6e"/>
    <polygon points="291,360 309,360 305,380 295,380" fill="#0369a1"/>
    <!-- Suit -->
    <path d="M 125,670 C 135,475 205,385 265,350 L 300,425 L 335,350 C 395,385 465,475 475,670 Z" fill="#0f1f33"/>
    <polygon points="265,350 225,440 285,510 295,430" fill="#162e4a"/>
    <polygon points="335,350 375,440 315,510 305,430" fill="#132840"/>
    <!-- Gold Lapel Pin -->
    <circle cx="242" cy="420" r="6" fill="url(#goldPin2)"/>
  </g>

  <rect x="15" y="15" width="570" height="670" rx="8" fill="none" stroke="url(#goldPin2)" stroke-width="1.5" opacity="0.35"/>
</svg>
